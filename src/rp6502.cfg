SYMBOLS {
    __STARTUP__:   type = import;
    __STACKSIZE__: type = weak, value = $0800;
}
MEMORY {
    # Zero page is partitioned rather than shared.
    #
    # The ported assembly keeps its variables at the addresses David Murray
    # gave them -- $02-$05 for the two pointers, $23-$3B for the rest -- because
    # that is what the code says and translating it was a source of quiet bugs
    # rather than a source of safety. So the game gets that range, and cc65's
    # runtime gets everything above it. Letting the linker enforce the split is
    # the difference between a rule and a hope.
    GAMEZP:   file = "", define = yes, start = $0002, size = $003A;
    ZP:       file = "", define = yes, start = $003C, size = $00C4;
    CPUSTACK: file = "",               start = $0100, size = $0100;
    RAM:      file = %O, define = yes, start = $0200, size = $FD00 - __STACKSIZE__;
}
SEGMENTS {
    GAMEZEROPAGE: load = GAMEZP, type = zp;
    ZEROPAGE: load = ZP,     type = zp;
    STARTUP:  load = RAM,    type = ro;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    DATA:     load = RAM,    type = rw,  define   = yes;
    BSS:      load = RAM,    type = bss, define   = yes;
    # LEVELDATA holds the eight unit arrays followed by MAP, in file order, so a
    # level is one read() into it. Page-aligned because GET_TILE_FROM_MAP builds
    # the map address as ORA MAP_X into a zero low byte and ADC #>MAP into the
    # high byte; src/game/globals.s asserts the alignment held.
    #
    # It must come after the loaded segments. It is bss, so it is not in the
    # output file, and rp6502_executable() loads that file at a fixed address --
    # putting an unwritten segment first would shift the code out from under the
    # load address.
    LEVELDATA: load = RAM,   type = bss, define = yes, align = $100;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
